[package]
name = "homing-agent"
version = "0.1.0-dev"
description = "On-device agent, launcher and admin CLI for homing app packages"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trevortomlin/homing-agent"
authors = ["Trevor Tomlin and homing contributors"]
readme = "README.md"
homepage = "https://github.com/trevortomlin/homing-agent"
keywords = ["ota", "flutter", "embedded", "updater", "rollback"]
categories = ["embedded", "os::linux-apis"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
homing-format = { git = "https://github.com/trevortomlin/homing-format", tag = "v0.1.0" }
nix = { version = "0.31", features = ["fs", "signal", "process", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
