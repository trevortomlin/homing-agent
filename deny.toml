# Dependency policy: permissive licenses only (MIT, Apache-2.0, BSD, ISC, Zlib, ...; no GPL).
# homing-agent runs on Linux only (systemd, /proc, prctl). Check the dependency graph of the
# targets it is built for; e.g. rustls-platform-verifier's wasm-only fallback roots
# (webpki-root-certs, CDLA-Permissive-2.0) are never part of a build.
[graph]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "armv7-unknown-linux-gnueabihf",
  "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "armv7-unknown-linux-musleabihf",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-git = ["https://github.com/trevortomlin/homing-format"]
