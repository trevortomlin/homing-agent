name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues** (for example a package that is accepted but should be rejected) must
        not be reported here. See [SECURITY.md](https://github.com/trevortomlin/homing-agent/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config and output (logs: `journalctl -u homing-agent`).
  - type: input
    id: version
    attributes:
      label: homing-agent version or commit
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Device, OS and Rust version
